[workspace]
resolver = "3"
members = ["crates/svxdist", "crates/svx-patcher", "crates/svx-release", "crates/testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
svxdist = { path = "crates/svxdist" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
